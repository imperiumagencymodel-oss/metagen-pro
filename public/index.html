<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MetaGen Pro</title>
</head>
<body style="background:#0a0c0b;color:#e8ede9;font-family:sans-serif;max-width:780px;margin:0 auto;padding:20px">
<h1 style="color:#3ddc84;margin-bottom:20px">MetaGen Pro ✦</h1>
<div id="dz" onclick="document.getElementById('fi').click()" style="border:2px dashed #3ddc84;border-radius:14px;padding:40px;text-align:center;cursor:pointer;margin-bottom:20px;background:#111412">
<p style="font-size:16px">🎬 Dépose ta vidéo ici</p>
<p style="font-size:13px;color:#8a9e8d;margin-top:8px">MP4 · MOV · AVI</p>
<input type="file" id="fi" accept="video/*" style="display:none">
</div>
<div id="editor" style="display:none">
<video id="vid" controls style="width:100%;max-height:300px;background:#000;border-radius:10px;margin-bottom:14px;display:block"></video>
<div style="background:#111412;border-radius:14px;padding:16px;margin-bottom:14px">
<select id="plat" style="padding:8px;margin:5px;background:#181c19;color:#e8ede9;border:1px solid #333;border-radius:8px">
<option>Instagram</option><option>YouTube</option><option>TikTok</option><option>LinkedIn</option>
</select>
<select id="nb" style="padding:8px;margin:5px;background:#181c19;color:#e8ede9;border:1px solid #333;border-radius:8px">
<option value="2">2 versions</option>
<option value="3" selected>3 versions</option>
<option value="5">5 versions</option>
<option value="10">10 versions</option>
<option value="20">20 versions</option>
<option value="30">30 versions</option>
<option value="50">50 versions</option>
</select>
<select id="lang" style="padding:8px;margin:5px;background:#181c19;color:#e8ede9;border:1px solid #333;border-radius:8px">
<option>français</option><option>anglais</option><option>espagnol</option>
</select>

<div style="margin-top:14px">
<p style="color:#3ddc84;font-size:13px;margin-bottom:8px">✦ Tes captions (une par ligne — chaque vidéo aura une caption différente) :</p>
<textarea id="captions" rows="8" placeholder="Caption 1&#10;Caption 2&#10;Caption 3&#10;Caption 4&#10;Caption 5&#10;Caption 6&#10;Caption 7&#10;Caption 8" style="width:100%;padding:10px;background:#181c19;color:#e8ede9;border:1px solid #333;border-radius:8px;font-size:13px;resize:vertical"></textarea>
</div>

<button onclick="generate()" style="background:#3ddc84;color:#000;border:none;padding:12px 24px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:10px">✦ Créer les versions</button>
</div>
</div>
<div id="results"></div>
<script>
let file=null,url=null,metas=[];
document.getElementById('fi').onchange=function(e){load(e.target.files[0]);};
document.getElementById('dz').ondragover=function(e){e.preventDefault();};
document.getElementById('dz').ondrop=function(e){e.preventDefault();load(e.dataTransfer.files[0]);};
function load(f){
  if(!f||!f.type.startsWith('video/'))return;
  file=f;
  if(url)URL.revokeObjectURL(url);
  url=URL.createObjectURL(f);
  var v=document.getElementById('vid');
  v.src=url;v.volume=1;v.muted=false;
  document.getElementById('editor').style.display='block';
}
async function generate(){
  if(!file)return;
  var n=parseInt(document.getElementById('nb').value);
  var plat=document.getElementById('plat').value;
  var lang=document.getElementById('lang').value;
  var captionsRaw=document.getElementById('captions').value;
  var captionsList=captionsRaw.split('\n').map(function(c){return c.trim();}).filter(function(c){return c!=='';});
  document.getElementById('results').innerHTML='<p style="color:#8a9e8d;text-align:center;padding:20px">⟳ Génération de '+n+' versions en cours...</p>';
  try{
    var fd=new FormData();
    fd.append('video',file);
    fd.append('platform',plat);
    fd.append('language',lang);
    fd.append('count',n);
    fd.append('captions',JSON.stringify(captionsList));
    var resp=await fetch('/api/generate',{method:'POST',body:fd});
    if(!resp.ok)throw new Error('Erreur serveur');
    var data=await resp.json();
    metas=data.results.map(function(r){return r.metadata;});
    var h='<h2 style="color:#3ddc84;margin-bottom:14px">'+data.results.length+' versions générées ✦</h2>';
    data.results.forEach(function(r,i){
      var x=r.metadata;
      var tags=(x.tags||[]).map(function(t){return '<span style="font-size:11px;border:1px solid #333;border-radius:4px;padding:2px 6px;margin:2px;display:inline-block">#'+t+'</span>';}).join('');
      h+='<div style="background:#111412;border:1px solid #222;border-radius:14px;padding:16px;margin-bottom:14px">';
      h+='<div style="display:flex;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px">';
      h+='<span style="font-size:11px;background:#181c19;padding:2px 8px;border-radius:4px">VERSION '+(i+1)+'</span>';
      h+='<span style="font-size:11px;background:#1a3326;color:#3ddc84;padding:2px 10px;border-radius:100px">'+(x.emoji||'')+' '+(x.angle||'')+'</span></div>';
      if(r.caption)'<div style="font-size:12px;color:#3ddc84;margin-bottom:6px">📝 Caption : '+r.caption+'</div>';
      h+='<div style="font-size:15px;font-weight:500;margin-bottom:6px">'+x.titre+'</div>';
      h+='<div style="font-size:12px;color:#8a9e8d;margin-bottom:8px;line-height:1.6">'+x.description+'</div>';
      h+='<div style="margin-bottom:12px">'+tags+'</div>';
      h+='<video controls style="width:100%;max-height:200px;background:#000;border-radius:8px;display:block;margin-bottom:10px"><source src="/api/download/'+r.filename+'" type="video/mp4"></video>';
      h+='<div style="display:flex;gap:8px">';
      h+='<a href="/api/download/'+r.filename+'" download="'+r.filename+'" style="flex:1;background:#3ddc84;color:#000;border:none;padding:10px;border-radius:8px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none">⬇ Télécharger version '+(i+1)+'</a>';
      h+='<button onclick="cp(this,'+i+')" style="background:#181c19;color:#8a9e8d;border:1px solid #333;padding:10px 14px;border-radius:8px;cursor:pointer">Copier texte</button>';
      h+='</div></div>';
    });
    document.getElementById('results').innerHTML=h;
  }catch(e){
    document.getElementById('results').innerHTML='<p style="color:#f09595">⚠ '+e.message+'</p>';
  }
}
function cp(btn,i){
  var x=metas[i];
  navigator.clipboard.writeText(x.titre+'\n\n'+x.description+'\n\n'+(x.tags||[]).map(function(t){return '#'+t;}).join(' ')).then(function(){btn.textContent='Copié!';setTimeout(function(){btn.textContent='Copier texte';},2000);});
}
</script>
</body>
</html>
